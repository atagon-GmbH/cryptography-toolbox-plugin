<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
    <!-- Background rounded square with dark gradient -->
    <rect width="40" height="40" rx="8" fill="url(#bg_grad_dark)"/>
    
    <!-- Shield / Cryptographic Vault contour -->
    <path d="M20 7L29 11V18.5C29 24.2 25.2 29.4 20 31C14.8 29.4 11 24.2 11 18.5V11L20 7Z" 
          fill="url(#shield_grad_dark)" stroke="#60A5FA" stroke-opacity="0.5" stroke-width="1"/>
    
    <!-- Keyhole / Cryptographic Lock Symbol -->
    <circle cx="20" cy="18" r="3.5" fill="#FFFFFF"/>
    <path d="M18.8 19.5L18 24H22L21.2 19.5C20.8 19.8 20.4 20 20 20C19.6 20 19.2 19.8 18.8 19.5Z" fill="#FFFFFF"/>
    
    <!-- Cyber circuit / crypto key accents -->
    <circle cx="15.5" cy="14" r="1" fill="#93C5FD"/>
    <circle cx="24.5" cy="14" r="1" fill="#93C5FD"/>
    <path d="M15.5 14L18 16" stroke="#93C5FD" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M24.5 14L22 16" stroke="#93C5FD" stroke-width="0.8" stroke-linecap="round"/>
    
    <defs>
        <linearGradient id="bg_grad_dark" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <linearGradient id="shield_grad_dark" x1="11" y1="7" x2="29" y2="31" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1E40AF"/>
        </linearGradient>
    </defs>
</svg>